; Configurações comuns aos ambientes de desenvolvimento e produção.
; Carregado após o perfil oficial e antes das sobrescritas do ambiente.
; Após editar os arquivos INI, reconstrua a imagem e recrie o container.
[PHP]
default_charset = "UTF-8"
memory_limit = 512M
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; Limites para processamento de uploads HTTP.
upload_max_filesize = 200M
post_max_size = 220M

[Date]
date.timezone = UTC
